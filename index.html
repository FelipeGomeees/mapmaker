<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="dist/index.js" defer></script>
    <link rel="stylesheet" href="styles/utils.css">
    <link rel="stylesheet" href="styles/map.css">
    <link rel="stylesheet" href="styles/gui.css">
    <link rel="stylesheet" href="styles/wrapper.css">
    <title>Document</title>
</head>
<body>
    <canvas id="color__map" width="900" height="900"></canvas>
    <canvas id="texture__map" width="900" height="900"></canvas>
    <canvas id="download__map" width="900" height="900"></canvas>
    <div id="wrapper"></div>
    <div id="gui">
        <div class="gui__selection-buttons">
            <button id="btn__default-selection">Default</button>
            <button id="btn__area-selection">Area</button>
            <button id="btn__fill-selection">Fill</button>
        </div>
        <div class="gui__layer-buttons">
            <button id="btn__color">Color</button>
            <button id="btn__texture">Texture</button>
            <button id="btn__sprite">Sprite</button>
            <button id="btn__collision">Collison</button>
        </div>
        <div class="gui__tile-area">
            <div class="tile-area__color" id="tile-area__color">
                <input class="tile" id="input__color" type="color">
            </div>
            <div class="tile-area__texture" id="tile-area__texture">
            </div>
            <div class="tile-area__sprite" id="tile-area__sprite">      
            </div>
        </div>
        <div id="gui__download">
            Download Map
        </div>
    </div>
</body>
</html>
